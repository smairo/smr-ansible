- name: Ensure Chocolatey is installed
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present
  when: windows_gaming_chocolatey_packages | length > 0

- name: Install Chocolatey packages
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ windows_gaming_chocolatey_packages }}"
    state: present
  when: windows_gaming_chocolatey_packages | length > 0
