- name: Install WinGet packages
  ansible.windows.win_powershell:
    parameters:
      Packages: "{{ windows_gaming_winget_packages }}"
    script: |
      param(
        [Object[]]$Packages
      )

      $ErrorActionPreference = 'Stop'
      $winget = Get-Command winget.exe -ErrorAction SilentlyContinue

      if (-not $winget) {
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = 'winget.exe was not found. Install or update Microsoft App Installer before running this playbook.'
          }
          return
      }

      function Test-WinGetPackageInstalled {
          param(
              [string]$Id
          )

          $output = & $winget.Source list --id $Id --exact --source winget --disable-interactivity 2>&1
          $text = $output | Out-String

          return ($LASTEXITCODE -eq 0) -and ($text -match [regex]::Escape($Id))
      }

      $changed = $false
      $present = [System.Collections.Generic.List[object]]::new()
      $installed = [System.Collections.Generic.List[object]]::new()
      $wouldInstall = [System.Collections.Generic.List[object]]::new()
      $failed = [System.Collections.Generic.List[object]]::new()

      foreach ($package in $Packages) {
          $name = [string]$package.name
          $id = [string]$package.id

          if (Test-WinGetPackageInstalled -Id $id) {
              $present.Add(@{ name = $name; id = $id })
              continue
          }

          if ($Ansible.CheckMode) {
              $changed = $true
              $wouldInstall.Add(@{ name = $name; id = $id })
              continue
          }

          $installArgs = @(
              'install',
              '--id', $id,
              '--exact',
              '--source', 'winget',
              '--silent',
              '--accept-package-agreements',
              '--accept-source-agreements',
              '--disable-interactivity'
          )

          $output = & $winget.Source @installArgs 2>&1
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
              $failed.Add(@{
                  name = $name
                  id = $id
                  exit_code = $exitCode
                  output = ($output | Out-String).Trim()
              })
              continue
          }

          $changed = $true
          $installed.Add(@{ name = $name; id = $id })
      }

      $Ansible.Changed = $changed
      $Ansible.Result = @{
          present = $present
          installed = $installed
          would_install = $wouldInstall
          failed = $failed
      }

      if ($failed.Count -gt 0) {
          $Ansible.Failed = $true
      }
  when: windows_gaming_winget_packages | length > 0
