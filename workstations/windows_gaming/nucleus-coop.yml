- name: Install Nucleus Co-op from GitHub release
  ansible.windows.win_powershell:
    parameters:
      ReleaseApiUrl: "{{ windows_gaming_nucleus_coop_release_api_url }}"
      InstallDir: "{{ windows_gaming_nucleus_coop_install_dir }}"
      ArchivePassword: "{{ windows_gaming_nucleus_coop_archive_password }}"
      AddDefenderExclusion: "{{ windows_gaming_nucleus_coop_add_defender_exclusion }}"
    script: |
      param(
        [string]$ReleaseApiUrl,
        [string]$InstallDir,
        [string]$ArchivePassword,
        [bool]$AddDefenderExclusion
      )

      $ErrorActionPreference = 'Stop'
      $ProgressPreference = 'SilentlyContinue'
      $changed = $false

      function Find-7Zip {
          $command = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if ($command) {
              return $command.Source
          }

          $paths = [System.Collections.Generic.List[string]]::new()

          if ($env:ProgramFiles) {
              $paths.Add((Join-Path $env:ProgramFiles '7-Zip\7z.exe'))
          }

          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          if ($programFilesX86) {
              $paths.Add((Join-Path $programFilesX86 '7-Zip\7z.exe'))
          }

          foreach ($path in $paths) {
              if ($path -and (Test-Path -LiteralPath $path)) {
                  return $path
              }
          }

          return $null
      }

      function Get-NormalizedPath {
          param(
              [string]$Path
          )

          return [System.IO.Path]::GetFullPath($Path).TrimEnd('\').ToLowerInvariant()
      }

      function Ensure-DefenderPathExclusion {
          param(
              [string]$Path
          )

          if (Test-DefenderPathExclusion -Path $Path) {
              return $false
          }

          Add-MpPreference -ExclusionPath $Path
          return $true
      }

      function Test-DefenderPathExclusion {
          param(
              [string]$Path
          )

          $getMpPreference = Get-Command Get-MpPreference -ErrorAction SilentlyContinue
          $addMpPreference = Get-Command Add-MpPreference -ErrorAction SilentlyContinue

          if (-not $getMpPreference -or -not $addMpPreference) {
              throw 'Microsoft Defender PowerShell cmdlets were not found; cannot manage the Nucleus Co-op folder exclusion.'
          }

          $targetPath = Get-NormalizedPath -Path $Path
          $existingPaths = @((Get-MpPreference).ExclusionPath) | ForEach-Object {
              if ($_ ) {
                  Get-NormalizedPath -Path $_
              }
          }

          if ($existingPaths -contains $targetPath) {
              return $true
          }

          return $false
      }

      $sevenZip = Find-7Zip
      if (-not $sevenZip) {
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = '7z.exe was not found. The WinGet package 7zip.7zip must install successfully before Nucleus Co-op can be extracted.'
          }
          return
      }

      $headers = @{
          'User-Agent' = 'smr-ansible'
          'Accept' = 'application/vnd.github+json'
      }

      $release = Invoke-RestMethod -Uri $ReleaseApiUrl -Headers $headers
      $asset = $release.assets | Where-Object { $_.name -eq 'NucleusApp.zip' } | Select-Object -First 1

      if (-not $asset) {
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = 'NucleusApp.zip was not found in the latest Nucleus Co-op GitHub release.'
              release = $release.html_url
          }
          return
      }

      $markerPath = Join-Path $InstallDir '.smr-ansible-nucleus-release.json'
      $nucleusExePath = Join-Path $InstallDir 'NucleusCoop.exe'
      $defenderExclusionMissing = $false
      if ($AddDefenderExclusion) {
          $defenderExclusionMissing = -not (Test-DefenderPathExclusion -Path $InstallDir)
      }

      if (Test-Path -LiteralPath $markerPath) {
          $marker = Get-Content -LiteralPath $markerPath -Raw | ConvertFrom-Json
          $installedReleaseMatches = (
              ($marker.tag_name -eq $release.tag_name) -and
              ($marker.asset_name -eq $asset.name) -and
              (Test-Path -LiteralPath $nucleusExePath)
          )

          if ($installedReleaseMatches) {
              if ($AddDefenderExclusion -and $defenderExclusionMissing) {
                  if ($Ansible.CheckMode) {
                      $changed = $true
                  }
                  else {
                      New-Item -Path $InstallDir -ItemType Directory -Force | Out-Null
                      $changed = (Ensure-DefenderPathExclusion -Path $InstallDir) -or $changed
                  }
              }

              $Ansible.Changed = $changed
              $Ansible.Result = @{
                  version = $release.tag_name
                  install_dir = $InstallDir
                  release = $release.html_url
                  defender_exclusion = $AddDefenderExclusion
              }
              return
          }
      }

      if ($Ansible.CheckMode) {
          $Ansible.Changed = $true
          $Ansible.Result = @{
              version = $release.tag_name
              install_dir = $InstallDir
              release = $release.html_url
              defender_exclusion = $AddDefenderExclusion
          }
          return
      }

      New-Item -Path $InstallDir -ItemType Directory -Force | Out-Null

      if ($AddDefenderExclusion) {
          $changed = (Ensure-DefenderPathExclusion -Path $InstallDir) -or $changed
      }

      $tempRoot = Join-Path $env:TEMP ('nucleus-coop-' + [guid]::NewGuid().ToString('N'))
      $archivePath = Join-Path $tempRoot $asset.name
      $extractPath = Join-Path $tempRoot 'extract'
      $backupPath = $null

      New-Item -Path $tempRoot -ItemType Directory -Force | Out-Null
      New-Item -Path $extractPath -ItemType Directory -Force | Out-Null

      try {
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath -Headers $headers
          Unblock-File -LiteralPath $archivePath -ErrorAction SilentlyContinue

          if ($asset.digest -and $asset.digest.StartsWith('sha256:')) {
              $expectedHash = $asset.digest.Substring('sha256:'.Length)
              $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()

              if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
                  throw "Nucleus Co-op archive SHA-256 mismatch. Expected $expectedHash, got $actualHash."
              }
          }

          $extractArgs = @(
              'x',
              $archivePath,
              "-o$extractPath",
              "-p$ArchivePassword",
              '-y'
          )

          $extractOutput = & $sevenZip @extractArgs 2>&1
          if ($LASTEXITCODE -ne 0) {
              throw "7-Zip failed extracting Nucleus Co-op: $($extractOutput | Out-String)"
          }

          $stagedNucleusExePath = Join-Path $extractPath 'NucleusCoop.exe'
          if (-not (Test-Path -LiteralPath $stagedNucleusExePath)) {
              throw "NucleusCoop.exe was not found after extracting $($asset.name)."
          }

          $existingInstallItems = @(Get-ChildItem -LiteralPath $InstallDir -Force -ErrorAction SilentlyContinue)
          if ($existingInstallItems.Count -gt 0) {
              $backupPath = '{0}.backup-{1}' -f $InstallDir.TrimEnd('\'), (Get-Date -Format 'yyyyMMddHHmmss')
              Move-Item -LiteralPath $InstallDir -Destination $backupPath
              New-Item -Path $InstallDir -ItemType Directory -Force | Out-Null
          }

          Copy-Item -Path (Join-Path $extractPath '*') -Destination $InstallDir -Recurse -Force

          if (-not (Test-Path -LiteralPath $nucleusExePath)) {
              throw "NucleusCoop.exe was not found after extracting $($asset.name)."
          }

          @{
              tag_name = $release.tag_name
              asset_name = $asset.name
              asset_digest = $asset.digest
              release = $release.html_url
              installed_at = (Get-Date).ToUniversalTime().ToString('o')
              defender_exclusion = $AddDefenderExclusion
              backup_path = $backupPath
          } | ConvertTo-Json | Set-Content -LiteralPath $markerPath -Encoding UTF8

          $Ansible.Changed = $true
          $Ansible.Result = @{
              version = $release.tag_name
              install_dir = $InstallDir
              release = $release.html_url
              defender_exclusion = $AddDefenderExclusion
              backup_path = $backupPath
          }
      }
      finally {
          Remove-Item -LiteralPath $tempRoot -Recurse -Force -ErrorAction SilentlyContinue
      }
