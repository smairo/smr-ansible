- hosts: windows_gaming
  gather_facts: false

  vars:
    windows_gaming_fail_on_manual_review_packages: true

    windows_gaming_winget_packages:
      - name: 7-Zip
        id: 7zip.7zip
      - name: Microsoft Visual C++ Redistributable 2015-2022 x64
        id: Microsoft.VCRedist.2015+.x64
      - name: Microsoft Visual C++ Redistributable 2015-2022 x86
        id: Microsoft.VCRedist.2015+.x86
      - name: Microsoft Edge WebView2 Runtime
        id: Microsoft.EdgeWebView2Runtime
      - name: Cemu
        id: Cemu.Cemu
      - name: Dolphin
        id: DolphinEmulator.Dolphin
      - name: RetroArch
        id: Libretro.RetroArch
      - name: Xemu
        id: xemu-project.xemu
      - name: Xenia
        id: Xenia.Xenia
      - name: Playnite
        id: Playnite.Playnite
      - name: PCSX2
        id: PCSX2Team.PCSX2
      - name: Epic Games Launcher
        id: EpicGames.EpicGamesLauncher
      - name: Rockstar Games Launcher
        id: RockstarGames.Launcher
      - name: Steam
        id: Valve.Steam
      - name: Vivaldi
        id: Vivaldi.Vivaldi
      - name: WinRAR
        id: RARLab.WinRAR
      - name: Proton VPN
        id: Proton.ProtonVPN
      - name: qBittorrent
        id: qBittorrent.qBittorrent
      - name: WizTree
        id: AntibodySoftware.WizTree
      - name: Prism Launcher
        id: PrismLauncher.PrismLauncher
      - name: Vortex
        id: NexusMods.Vortex

    windows_gaming_chocolatey_packages:
      - rpcs3
      - ryujinx

    windows_gaming_nucleus_coop_release_api_url: https://api.github.com/repos/SplitScreen-Me/splitscreenme-nucleus/releases/latest
    windows_gaming_nucleus_coop_install_dir: C:\NucleusCo-op
    windows_gaming_nucleus_coop_archive_password: nucleus
    windows_gaming_nucleus_coop_add_defender_exclusion: true

    windows_gaming_manual_review_packages:
      - name: Citron
        reason: No current WinGet or Chocolatey package was found.

  tasks:
    - name: Install WinGet workstation packages
      ansible.builtin.import_tasks: windows_gaming/winget-packages.yml

    - name: Install Chocolatey workstation packages
      ansible.builtin.import_tasks: windows_gaming/chocolatey-packages.yml

    - name: Install Nucleus Co-op
      ansible.builtin.import_tasks: windows_gaming/nucleus-coop.yml

    - name: Report packages that need manual install automation
      ansible.builtin.import_tasks: windows_gaming/manual-review-packages.yml
