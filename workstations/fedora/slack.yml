- name: Ensure Slack RPM is available for this CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture == "x86_64"
    fail_msg: "Slack publishes Fedora RPM packages for x86_64 only, not {{ ansible_architecture }}."

- name: Import Slack Packagecloud repository signing key
  ansible.builtin.rpm_key:
    key: https://packagecloud.io/slacktechnologies/slack/gpgkey
    state: present
  register: fedora_slack_repository_key

- name: Configure Slack Packagecloud repository
  ansible.builtin.yum_repository:
    name: slacktechnologies_slack
    description: slacktechnologies_slack
    # Slack publishes current Fedora RPMs in Packagecloud's Fedora 21 bucket.
    baseurl: "https://packagecloud.io/slacktechnologies/slack/fedora/21/$basearch"
    enabled: true
    repo_gpgcheck: true
    gpgcheck: false
    gpgkey: https://packagecloud.io/slacktechnologies/slack/gpgkey
    sslverify: true
    sslcacert: /etc/pki/tls/certs/ca-bundle.crt
    metadata_expire: 300
    file: slacktechnologies_slack
  register: fedora_slack_repository

- name: Clear stale DNF metadata for Slack repository
  ansible.builtin.command:
    argv:
      - dnf
      - --disablerepo=*
      - --enablerepo=slacktechnologies_slack
      - clean
      - metadata
  changed_when: false
  when: not ansible_check_mode

- name: Refresh DNF metadata for Slack repository
  ansible.builtin.command:
    argv:
      - dnf
      - --disablerepo=*
      - --enablerepo=slacktechnologies_slack
      - makecache
  changed_when: false
  when: not ansible_check_mode

- name: Install Slack
  ansible.builtin.dnf:
    name: slack
    state: present
    enablerepo: slacktechnologies_slack
  when: >
    not ansible_check_mode
    or not (fedora_slack_repository_key.changed or fedora_slack_repository.changed)
