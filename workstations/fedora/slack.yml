- name: Ensure Slack RPM is available for this CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture == "x86_64"
    fail_msg: "Slack publishes Linux RPM packages for x86_64 only, not {{ ansible_architecture }}."

- name: Remove old Slack repository file
  ansible.builtin.file:
    path: /etc/yum.repos.d/slacktechnologies_slack.repo
    state: absent

- name: Import Slack package signing key
  ansible.builtin.rpm_key:
    key: https://slack.com/gpg/slack_pubkey_20251016.gpg
    state: present
  when: not ansible_check_mode

- name: Fetch Slack Linux RPM download page
  ansible.builtin.uri:
    url: https://slack.com/downloads/instructions/linux?ddl=1&build=rpm
    return_content: true
  register: fedora_slack_download_page
  when: not ansible_check_mode

- name: Find current Slack RPM download URL
  ansible.builtin.set_fact:
    fedora_slack_rpm_url: "{{ fedora_slack_download_page.content | regex_search('https://downloads\\.slack-edge\\.com/desktop-releases/linux/x64/[^\"]+\\.rpm') }}"
  when: not ansible_check_mode

- name: Ensure Slack RPM download URL was found
  ansible.builtin.assert:
    that:
      - fedora_slack_rpm_url is defined
      - fedora_slack_rpm_url is match("^https://downloads\\.slack-edge\\.com/desktop-releases/linux/x64/.+\\.rpm$")
    fail_msg: "Could not find Slack's RPM download URL on the official Slack downloads page."
  when: not ansible_check_mode

- name: Install Slack
  ansible.builtin.dnf:
    name: "{{ fedora_slack_rpm_url }}"
    state: present
  when: not ansible_check_mode
