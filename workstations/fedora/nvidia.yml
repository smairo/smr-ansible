- name: Detect NVIDIA graphics hardware
  ansible.builtin.shell:
    cmd: "lspci -nn | grep -Ei 'vga|3d|display' | grep -i nvidia"
  check_mode: false
  register: nvidia_gpu
  changed_when: false
  failed_when: false

- name: Install NVIDIA driver dependencies and packages
  when:
    - nvidia_gpu.rc | default(1) == 0
    - >
      not ansible_check_mode
      or not (
        fedora_rpmfusion_free_repository.changed | default(false)
        or fedora_rpmfusion_nonfree_repository.changed | default(false)
      )
  ansible.builtin.dnf:
    name:
      - kmodtool
      - akmods
      - mokutil
      - openssl
      - gcc
      - kernel-headers
      - kernel-devel
      - akmod-nvidia
      - xorg-x11-drv-nvidia
      - xorg-x11-drv-nvidia-libs
      - xorg-x11-drv-nvidia-libs.i686
    state: present
